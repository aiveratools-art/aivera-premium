<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>AIvera Premium</title>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:
    radial-gradient(
      circle at 20% 10%,
      #12305b 0,
      #050914 38%,
      #02040a 100%
    );
  color:#fff;
  font-family:Arial,sans-serif
}

.box{
  width:min(620px,100%);
  padding:38px 26px;
  text-align:center;
  border:1px solid #24466f;
  border-radius:26px;
  background:rgba(5,14,30,.82);
  box-shadow:0 30px 90px rgba(0,0,0,.45)
}

h1{
  margin:0 0 10px;
  font-size:44px;
  color:#29a9ff
}

.sub{
  color:#d8e2ef;
  font-size:18px;
  margin-bottom:28px
}

.tag{
  display:inline-block;
  margin-bottom:22px;
  padding:8px 13px;
  border:1px solid #35618f;
  border-radius:999px;
  color:#9fd6ff;
  font-size:12px
}

input,
button{
  width:100%;
  height:58px;
  border-radius:13px;
  font-size:18px
}

input{
  margin-bottom:12px;
  padding:0 18px;
  border:1px solid #365a83;
  background:#07132d;
  color:#fff;
  outline:none
}

button{
  margin-bottom:12px;
  border:0;
  background:
    linear-gradient(
      135deg,
      #29a9ff,
      #1675ff
    );
  color:#fff;
  font-weight:800;
  cursor:pointer
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

.hidden{
  display:none!important
}

#msg{
  min-height:28px;
  margin-top:8px;
  color:#ffd84d;
  white-space:pre-wrap
}

.small{
  color:#8ea0b5;
  font-size:12px;
  margin-top:12px
}

.price{
  font-size:28px;
  font-weight:900;
  margin:10px 0 18px;
  color:#9fd6ff
}

</style>

</head>

<body>

<main class="box">

<div class="tag">
10,000 AI TOOLS • PREMIUM ACCESS
</div>

<h1>
AIvera Premium
</h1>

<div class="sub">
Complete AI Tools Directory Access
</div>


<section id="loginBox">

<input
  id="mobile"
  type="tel"
  inputmode="numeric"
  maxlength="10"
  placeholder="Enter 10-digit mobile number"
>

<button
  id="sendBtn"
  onclick="sendOTP()"
>
Send OTP
</button>

</section>


<section
  id="otpBox"
  class="hidden"
>

<input
  id="otp"
  type="tel"
  inputmode="numeric"
  maxlength="6"
  placeholder="Enter OTP"
>

<button
  id="verifyBtn"
  onclick="verifyOTP()"
>
Verify OTP
</button>

<button
  id="resendBtn"
  onclick="sendOTP()"
>
Resend OTP
</button>

</section>


<section
  id="payBox"
  class="hidden"
>

<h2>
Premium Access
</h2>

<div class="price">
₹99 one-time
</div>

<button
  onclick="payNow()"
>
Pay ₹99 Securely
</button>

</section>


<div id="msg"></div>

<div class="small">
Secure mobile verification • Razorpay payment • Premium access
</div>

</main>


<script src="https://checkout.razorpay.com/v1/checkout.js"></script>


<script>

function show(x){
  document.getElementById("msg").textContent =
    x || "";
}


function phone(){

  return document
    .getElementById("mobile")
    .value
    .replace(/\D/g,"")
    .replace(/^91(?=\d{10}$)/,"");

}


function valid(){

  if(phone().length !== 10){

    show(
      "Please enter a valid 10-digit mobile number."
    );

    return false;
  }

  return true;
}


/* SEND OTP */

async function sendOTP(){

  if(!valid()) return;

  const b =
    document.getElementById("sendBtn");

  b.disabled = true;

  show("Sending OTP...");

  try{

    const r =
      await fetch(
        "/api/send-otp",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          credentials:"include",

          body:JSON.stringify({
            phone:phone()
          })
        }
      );

    const d =
      await r
        .json()
        .catch(()=>({}));

    if(!r.ok){

      show(
        d.error ||
        "OTP could not be sent."
      );

      return;
    }

    document
      .getElementById("loginBox")
      .classList
      .add("hidden");

    document
      .getElementById("otpBox")
      .classList
      .remove("hidden");

    show(
      "OTP sent. Check your SMS."
    );

  }catch(e){

    show(
      "Network error. Please try again."
    );

  }finally{

    b.disabled = false;
  }
}


/* VERIFY OTP */

async function verifyOTP(){

  const otp =
    document
      .getElementById("otp")
      .value
      .replace(/\D/g,"");

  if(!otp){

    show(
      "Please enter the OTP."
    );

    return;
  }

  const b =
    document.getElementById(
      "verifyBtn"
    );

  b.disabled = true;

  show("Verifying OTP...");

  try{

    const r =
      await fetch(
        "/api/verify-otp",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          credentials:"include",

          body:JSON.stringify({
            otp
          })
        }
      );

    const d =
      await r
        .json()
        .catch(()=>({}));

    if(!r.ok){

      show(
        d.error ||
        "OTP verification failed."
      );

      return;
    }

    if(d.premium === true){

      show(
        "Premium already active. Opening..."
      );

      setTimeout(
        () =>
          location.href =
            "/directory.html",
        700
      );

      return;
    }

    document
      .getElementById("otpBox")
      .classList
      .add("hidden");

    document
      .getElementById("payBox")
      .classList
      .remove("hidden");

    show(
      "Mobile verified. Complete the ₹99 payment."
    );

  }catch(e){

    show(
      "Network error. Please try again."
    );

  }finally{

    b.disabled = false;
  }
}


/* PAYMENT */

async function payNow(){

  show(
    "Creating secure payment order..."
  );

  try{

    const r =
      await fetch(
        "/api/create-order",
        {
          method:"POST",
          credentials:"include"
        }
      );

    const o =
      await r
        .json()
        .catch(()=>({}));

    if(!r.ok){

      show(
        o.error ||
        "Unable to create payment order."
      );

      return;
    }

    if(o.premium === true){

      location.href =
        "/directory.html";

      return;
    }


    const rp =
      new Razorpay({

        key:o.key_id,

        amount:o.amount,

        currency:o.currency,

        name:"AIvera Premium",

        description:
          "Premium AI Tools Directory Access",

        order_id:o.order_id,


        handler:async p=>{

          show(
            "Verifying payment..."
          );

          const vr =
            await fetch(
              "/api/verify-payment",
              {
                method:"POST",

                headers:{
                  "Content-Type":
                    "application/json"
                },

                credentials:"include",

                body:JSON.stringify({

                  razorpay_payment_id:
                    p.razorpay_payment_id,

                  razorpay_order_id:
                    p.razorpay_order_id,

                  razorpay_signature:
                    p.razorpay_signature

                })
              }
            );

          const d =
            await vr
              .json()
              .catch(()=>({}));

          if(!vr.ok){

            show(
              d.error ||
              "Payment verification failed."
            );

            return;
          }

          show(
            "Payment successful. Opening Premium..."
          );

          setTimeout(
            () =>
              location.href =
                "/directory.html",
            700
          );

        },


        modal:{
          ondismiss:() =>
            show(
              "Payment cancelled."
            )
        }

      });

    rp.open();

  }catch(e){

    show(
      "Payment system error."
    );

  }
}

</script>

</body>

</html>
