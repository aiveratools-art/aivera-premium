<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AIvera Premium</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      background:#050914;
      color:white;
      font-family:Arial,sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .box{
      width:90%;
      max-width:600px;
      text-align:center;
      padding:30px;
    }

    h1{
      color:#29a9ff;
      font-size:42px;
    }

    input{
      width:100%;
      height:58px;
      box-sizing:border-box;
      margin:10px 0;
      padding:15px;
      border-radius:12px;
      border:1px solid #52709b;
      background:#07132d;
      color:white;
      font-size:18px;
    }

    button{
      width:100%;
      height:58px;
      margin:10px 0;
      border:0;
      border-radius:12px;
      background:#269cff;
      color:white;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      position:relative;
      z-index:9999;
    }

    button:disabled{
      opacity:.6;
    }

    #otpBox,
    #payBox{
      display:none;
    }

    #msg{
      min-height:30px;
      margin-top:15px;
      color:#ffd84d;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>AIvera Premium</h1>

  <p>Premium AI Tools Directory Access</p>

  <div id="loginBox">

    <input
      id="mobile"
      type="tel"
      inputmode="numeric"
      maxlength="10"
      placeholder="Enter 10-digit mobile number"
    >

    <button
      type="button"
      id="sendBtn">
      Send OTP
    </button>

  </div>


  <div id="otpBox">

    <input
      id="otp"
      type="tel"
      inputmode="numeric"
      maxlength="6"
      placeholder="Enter OTP"
    >

    <button type="button" id="verifyBtn">
      Verify OTP
    </button>

    <button type="button" id="resendBtn">
      Resend OTP
    </button>

  </div>


  <div id="payBox">

    <h2>Premium Access</h2>

    <p>One-time payment: ₹20</p>

    <button type="button" id="payBtn">
      Pay ₹20
    </button>

  </div>


  <div id="msg"></div>

</div>
