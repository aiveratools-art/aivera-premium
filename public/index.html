<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AIvera Premium</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 28px;
      padding: 42px 34px 34px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }

    .logo .ai {
      color: #fff;
    }

    .logo .vera {
      color: #dfbd61;
    }

    h1 {
      font-size: 30px;
      margin: 0 0 14px;
    }

    .subtitle {
      color: #aaa;
      font-size: 16px;
      line-height: 1.65;
      margin-bottom: 28px;
    }

    .input {
      width: 100%;
      height: 58px;
      border: 1px solid #444;
      border-radius: 15px;
      background: #edf3ff;
      color: #111;
      font-size: 18px;
      padding: 0 18px;
      outline: none;
      margin-bottom: 14px;
    }

    .input:focus {
      border-color: #dfbd61;
    }

    .btn {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 15px;
      background: #dfbd61;
      color: #090909;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      padding: 0 18px;
      margin-top: 4px;
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .btn.secondary {
      background: #242424;
      color: #fff;
      border: 1px solid #3b3b3b;
    }
