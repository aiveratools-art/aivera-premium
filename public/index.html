<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AIvéra Premium</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:460px;
  background:#111;
  border:1px solid #292929;
  border-radius:22px;
  padding:32px 24px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
  font-size:34px;
  font-weight:800;
  margin-bottom:8px;
}

.logo span{
  color:#d9b866;
}

h1{
  font-size:25px;
  margin:15px 0 10px;
}

.sub{
  color:#aaa;
  line-height:1.5;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #444;
  background:#181818;
  color:#fff;
  font-size:17px;
  outline:none;
  margin-bottom:12px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#d9b866;
  color:#080808;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.secondary{
  margin-top:10px;
  background:#222;
  color:#fff;
}

#otpBox,
#payBox{
  display:none;
}

.msg{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#191919;
  color:#ddd;
  font-size:14px;
  line-height:1.4;
}

.small{
  margin-top:18px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">AI<span>véra</span></div>

  <h1>Premium AI Tools Directory</h1>

  <div class="sub">
    Verify your mobile number to continue.
    One-time ₹20 payment unlocks Premium permanently for this number.
  </div>

  <!-- MOBILE -->
  <div id="mobileBox">

    <input
      id="phone"
      type="tel"
      inputmode="numeric"
      maxlength="10"
      placeholder="Enter 10-digit mobile number"
    >

    <button id="sendBtn">
      Send OTP
    </button>

  </div>


  <!-- OTP -->
  <div id="otpBox">

    <input
      id="otp"
      type="tel"
      inputmode="numeric"
      maxlength="4"
      placeholder="Enter 4-digit OTP"
    >

    <button id="verifyBtn">
      Verify OTP
    </button>

    <button
      id="retryBtn"
      class="secondary"
    >
      Resend OTP
    </button>

  </div>


  <!-- PAYMENT -->
  <div id="payBox">

    <div class="sub">
      Your number is verified.<br>
      Pay ₹20 once to unlock Premium.
    </div>

    <button id="payBtn">
      Unlock AIvéra — Pay ₹20
    </button>

  </div>


  <div id="msg" class="msg"></div>

  <div class="small">
    Secure OTP verification • Secure Razorpay payment
  </div>

</div>


<script>

const MSG91_WIDGET_ID = '36696b634d33333333333338333632336';
const MSG91_TOKEN = '569942T8YbLOWaARC6aa3789aP1';

let currentReqId = null;


// -------------------------
// Elements
// -------------------------

const mobileBox = document.getElementById('mobileBox');
const otpBox = document.getElementById('otpBox');
const payBox = document.getElementById('payBox');

const phoneInput = document.getElementById('phone');
const otpInput = document.getElementById('otp');

const sendBtn = document.getElementById('sendBtn');
const verifyBtn = document.getElementById('verifyBtn');
const retryBtn = document.getElementById('retryBtn');
const payBtn = document.getElementById('payBtn');

const msg = document.getElementById('msg');


// -------------------------
// Message
// -------------------------

function showMessage(text){
  msg.textContent = text;
  msg.style.display = 'block';
}

function hideMessage(){
  msg.style.display = 'none';
}


// -------------------------
// MSG91
// -------------------------

var configuration = {

  widgetId: MSG91_WIDGET_ID,

  tokenAuth: MSG91_TOKEN,

  identifier: '',

  exposeMethods: true,

  captchaRenderId: '',

  success: function(data){
    console.log('MSG91 success:', data);
  },

  failure: function(error){
    console.log('MSG91 failure:', error);
  }

};


// MSG91 SDK is loaded below.
// initSendOTP will run automatically.


function getAccessToken(data){

  if(!data) return null;

  if(typeof data === 'string'){
    return data;
  }

  return (
    data.access_token ||
    data.accessToken ||
    data.token ||
    data.data?.access_token ||
    data.data?.accessToken ||
    data.data?.token ||
    null
  );
}


// -------------------------
// Send OTP
// -------------------------

sendBtn.onclick = function(){

  hideMessage();

  let phone = phoneInput.value.replace(/\D/g,'');

  if(phone.length !== 10){
    showMessage('Please enter a valid 10-digit mobile number.');
    return;
  }

  sendBtn.disabled = true;

  showMessage('Sending OTP...');

  window.sendOtp(
    '91' + phone,

    function(data){

      console.log('OTP sent:', data);

      currentReqId =
        data?.reqId ||
        data?.req_id ||
        data?.data?.reqId ||
        data?.data?.req_id ||
        null;

      mobileBox.style.display = 'none';
      otpBox.style.display = 'block';

      sendBtn.disabled = false;

      showMessage('OTP sent successfully. Enter the 4-digit OTP.');
    },

    function(error){

      console.error(error);

      sendBtn.disabled = false;

      showMessage(
        'OTP send failed. Please check your number and try again.'
      );
    }
  );
};


// -------------------------
// Verify OTP
// -------------------------

verifyBtn.onclick = function(){

  hideMessage();

  const otp = otpInput.value.replace(/\D/g,'');

  if(otp.length !== 4){
    showMessage('Enter the 4-digit OTP.');
    return;
  }

  verifyBtn.disabled = true;

  showMessage('Verifying OTP...');

  window.verifyOtp(
    Number(otp),

    async function(data){

      console.log('OTP verified:', data);

      const accessToken = getAccessToken(data);

      if(!accessToken){

        verifyBtn.disabled = false;

        showMessage(
          'OTP verified but access token was not received.'
        );

        return;
      }

      await loginToServer(accessToken);
    },

    function(error){

      console.error(error);

      verifyBtn.disabled = false;

      showMessage(
        'Invalid or expired OTP. Please try again.'
      );
    },

    currentReqId
  );
};


// -------------------------
// Send MSG91 access token
// to Cloudflare Worker
// -------------------------

async function loginToServer(accessToken){

  try{

    const r = await fetch(
      '/api/msg91/verify',
      {
        method:'POST',
        headers:{
          'content-type':'application/json'
        },
        body:JSON.stringify({
          accessToken
        })
      }
    );

    const d = await r.json();

    if(!r.ok){
      throw new Error(
        d.error || 'Server verification failed.'
      );
    }

    if(d.premium){

      showMessage(
        'Premium already unlocked. Opening AIvéra...'
      );

      setTimeout(function(){
        window.location.href='/directory.html';
      },700);

      return;
    }

    otpBox.style.display='none';
    payBox.style.display='block';

    showMessage(
      'Mobile verified. Pay ₹20 once to unlock Premium.'
    );

  }catch(e){

    console.error(e);

    verifyBtn.disabled = false;

    showMessage(
      e.message || 'Verification failed.'
    );
  }
}


// -------------------------
// Resend OTP
// -------------------------

retryBtn.onclick = function(){

  const phone = phoneInput.value.replace(/\D/g,'');

  if(phone.length !== 10){
    showMessage('Invalid mobile number.');
    return;
  }

  retryBtn.disabled = true;

  showMessage('Resending OTP...');

  window.retryOtp(
    null,

    function(data){

      console.log('OTP resent:', data);

      currentReqId =
        data?.reqId ||
        data?.req_id ||
        data?.data?.reqId ||
        data?.data?.req_id ||
        currentReqId;

      retryBtn.disabled = false;

      showMessage('OTP resent successfully.');
    },

    function(error){

      console.error(error);

      retryBtn.disabled = false;

      showMessage(
        'Could not resend OTP. Please try again.'
      );
    },

    currentReqId
  );
};


// -------------------------
// Razorpay
// -------------------------

payBtn.onclick = async function(){

  payBtn.disabled = true;

  showMessage('Creating secure payment...');

  try{

    const r = await fetch(
      '/api/create-order',
      {
        method:'POST',
        headers:{
          'content-type':'application/json'
        },
        body:JSON.stringify({})
      }
    );

    const d = await r.json();

    if(!r.ok){
      throw new Error(
        d.error || 'Could not create payment order.'
      );
    }

    if(d.premium){

      window.location.href='/directory.html';
      return;
    }

    const razorpay = new Razorpay({

      key:d.key_id,

      amount:d.amount,

      currency:d.currency,

      name:'AIvéra',

      description:'AIvéra Premium — 1,000+ AI Apps',

      order_id:d.order_id,

      prefill:{},

      theme:{
        color:'#d9b866'
      },

      handler:async function(response){

        showMessage(
          'Payment successful. Verifying securely...'
        );

        try{

          const vr = await fetch(
            '/api/verify-payment',
            {
              method:'POST',
              headers:{
                'content-type':'application/json'
              },
              body:JSON.stringify(response)
            }
          );

          const vd = await vr.json();

          if(!vr.ok || !vd.ok){

            throw new Error(
              vd.error || 'Payment verification failed.'
            );
          }

          showMessage(
            'Premium unlocked successfully!'
          );

          setTimeout(function(){
            window.location.href='/directory.html';
          },700);

        }catch(e){

          payBtn.disabled = false;

          showMessage(
            e.message || 'Payment verification failed.'
          );
        }

      },

      modal:{
        ondismiss:function(){

          payBtn.disabled = false;

          showMessage(
            'Payment window closed. You can try again.'
          );
        },

        escape:false
      }

    });

    razorpay.open();

  }catch(e){

    console.error(e);

    payBtn.disabled = false;

    showMessage(
      e.message || 'Something went wrong.'
    );
  }
};


// -------------------------
// Check existing session
// -------------------------

async function checkSession(){

  try{

    const r = await fetch('/api/session');

    const d = await r.json();

    if(d.loggedIn && d.premium){

      showMessage(
        'Premium already unlocked. Opening AIvéra...'
      );

      mobileBox.style.display='none';
      otpBox.style.display='none';
      payBox.style.display='none';

      setTimeout(function(){
        window.location.href='/directory.html';
      },500);

    }else if(d.loggedIn){

      mobileBox.style.display='none';
      otpBox.style.display='none';
      payBox.style.display='block';

      showMessage(
        'Mobile verified. Pay ₹20 to unlock Premium.'
      );
    }

  }catch(e){

    console.log('Session check failed:',e);

  }
}

checkSession();

</script>


<script
  type="text/javascript"
  onload="initSendOTP(configuration)"
  src="https://verify.msg91.com/otp-provider.js">
</script>

</body>
</html>
