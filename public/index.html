<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIvera Premium</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050914;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 620px;
      padding: 35px 25px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 42px;
      color: #29a9ff;
    }

    .sub {
      font-size: 18px;
      margin-bottom: 30px;
      color: #ddd;
    }

    input {
      width: 100%;
      height: 58px;
      border-radius: 12px;
      border: 1px solid #52709b;
      background: #07132d;
      color: white;
      padding: 0 18px;
      font-size: 18px;
      outline: none;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      height: 58px;
      border: 0;
      border-radius: 12px;
      background: #269cff;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #otpBox,
    #payBox {
      display: none;
      margin-top: 10px;
    }

    #msg {
      min-height: 28px;
      margin-top: 10px;
      color: #ffd84d;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .small {
      color: #999;
      font-size: 13px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>AIvera Premium</h1>

  <div class="sub">
    Premium AI Tools Directory Access
  </div>

  <div id="loginBox">

    <input
      id="mobile"
      type="tel"
      inputmode="numeric"
      maxlength="10"
      placeholder="Enter 10-digit mobile number"
    >

    <button id="sendBtn" onclick="sendOTP()">
      Send OTP
    </button>

  </div>

  <div id="otpBox">

    <input
      id="otp"
      type="tel"
      inputmode="numeric"
      maxlength="6"
      placeholder="Enter OTP"
    >

    <button id="verifyBtn" onclick="verifyOTP()">
      Verify OTP
    </button>

    <button id="resendBtn" onclick="resendOTP()">
      Resend OTP
    </button>

  </div>

  <div id="payBox">

    <h2>Premium Access</h2>

    <p>One-time payment: ₹20</p>

    <button onclick="payNow()">
      Pay ₹20
    </button>

  </div>

  <div id="msg"></div>

  <div class="small">
    Secure OTP verification powered by MSG91
  </div>

</div>
